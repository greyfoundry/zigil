name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Mintlify sources
    runs-on: ubuntu-latest
    env:
      MINTLIFY_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository metadata
        run: |
          python3 tools/check_repository.py
          python3 tools/check-conformance-source.py
      - name: Validate documentation and internal links
        working-directory: docs
        run: |
          npm exec --yes --package=mint@4.3.96 -- mint validate
          npm exec --yes --package=mint@4.3.96 -- mint broken-links

  test:
    name: Zig 0.17.1 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified Zig archive (Linux or macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$(uname -m)" in
            Linux/x86_64)
              distribution=zig-x86_64-linux-0.17.1
              expected=3581863e3cbcfd0fce0efc682ce7e9e93da96668a977791d356a26d2a7e9b17a ;;
            macOS/arm64)
              distribution=zig-aarch64-macos-0.17.1
              expected=75f1bc7a1e9852f17ec9a0c1895f767c4ec56d46bc8a834920eece1d0359dd8d ;;
            macOS/x86_64)
              distribution=zig-x86_64-macos-0.17.1
              expected=9af07b20319fbd0c92ee46ad23e81d6a782b1aaea2cfb8dcbff35f1d2c7ddbb7 ;;
            *) echo 'Unsupported runner architecture' >&2; exit 1 ;;
          esac
          archive="$distribution.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" "https://ziglang.org/download/0.17.1/$archive"
          actual="$(shasum -a 256 "$archive" | cut -d' ' -f1)"
          test "$actual" = "$expected"
          tar -xJf "$archive"
          echo "$RUNNER_TEMP/$distribution" >> "$GITHUB_PATH"

      - name: Install verified Zig archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.17.1.zip'
          Invoke-WebRequest 'https://ziglang.org/download/0.17.1/zig-x86_64-windows-0.17.1.zip' -OutFile $archive
          if ((Get-FileHash $archive -Algorithm SHA256).Hash.ToLower() -ne 'b03f477a1943673e02aca0f570e8030dffd536ce1f45cbc4d3326ec31159562e') {
            throw 'Zig archive hash mismatch'
          }
          Expand-Archive $archive -DestinationPath $env:RUNNER_TEMP
          (Join-Path $env:RUNNER_TEMP 'zig-x86_64-windows-0.17.1') | Out-File $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Native tests, examples, API docs and consumer package
        shell: bash
        run: |
          set -euo pipefail
          test "$(zig version)" = 0.17.1
          zig fmt --check build.zig build.zig.zon src examples tests bench
          zig build check test docs run-examples --summary all
          zig build test -Doptimize=ReleaseSafe --summary all
          bash tools/check-consumer.sh -Doptimize=ReleaseSafe --summary all

      - name: Optional native schema engine and official conformance
        shell: bash
        run: |
          set -euo pipefail
          rounds=1
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            rounds=100
          fi
          zig build test conformance -Dschema-regex=true -Doptimize=ReleaseSafe -Dfuzz-rounds="$rounds" --summary all
          bash tools/check-consumer.sh -Dschema-regex=true -Doptimize=ReleaseSafe --summary all

      - name: Independent schema export oracle
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/schema-oracle"
          "$RUNNER_TEMP/schema-oracle/bin/pip" install -r tools/oracle-requirements.txt
          "$RUNNER_TEMP/schema-oracle/bin/python" tools/check-schema-export.py
          zig build bench -Doptimize=ReleaseSafe --summary all

      - name: Compile representative cross targets
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          for target in aarch64-linux-gnu x86_64-windows-gnu aarch64-macos; do
            zig build check -Dtarget="$target" -Doptimize=ReleaseSafe --summary all
          done

  upcoming-compiler:
    name: Advisory upcoming compiler
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Probe pinned development compiler
        shell: bash
        run: |
          set -euo pipefail
          version=0.18.0-dev.1311+3a0e028c5
          archive="zig-x86_64-linux-$version.tar.xz"
          cd "$RUNNER_TEMP"
          curl -fsSLo "$archive" "https://ziglang.org/builds/$archive"
          echo "86802acd1c2ae5d1c6ab4be84fb207bdeedb19c8d4493813e0d00a70a4613b12  $archive" | sha256sum -c -
          tar -xJf "$archive"
          cd "$GITHUB_WORKSPACE"
          "$RUNNER_TEMP/zig-x86_64-linux-$version/zig" version
          "$RUNNER_TEMP/zig-x86_64-linux-$version/zig" build check test --summary all
